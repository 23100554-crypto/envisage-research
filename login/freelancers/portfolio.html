<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Portfolio gallery | Envisage</title>
    <link rel="stylesheet" href="../styles.css" />

  <body class="booking-page portfolio-page workspace-polished">

      <a class="brand" href="availability.html"
