<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password | Envisage</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../account-support-layout.css" />
  </head>
  <body class="simple-page account-polished">
    <main class="account-card">
      <a class="brand account-brand" href="login.html"
        ><span class="brand-mark">E</span><span>envisage</span></a
      ><a class="back-link" href="login.html">← Back to sign in</a>
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1 class="account-title">Reset your password.</h1>
      <p class="account-copy">
        Enter your email and we’ll send a password reset link.
      </p>
      <form id="reset-form">
        <label for="reset-email">Email address</label
        ><input id="reset-email" type="email" required placeholder="you@example.com" /><button
          class="submit"
          type="submit"
        >
          Send reset instructions →
        </button>
        <p class="form-message" id="reset-message"></p>
      </form>
    </main>
    <script src="../supabase-config.js"></script>
    <script src="../backend.js"></script>
    <script src="../password-recovery.js"></script>
    <script src="../navigation-controls.js"></script>
  </body>
</html>
