<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a new password | Envisage</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../account-support-layout.css" />
  </head>
  <body class="simple-page account-polished">
    <main class="account-card">
      <h1 class="account-title">Choose a new password.</h1>
      <form id="update-password-form">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" minlength="8" autocomplete="new-password" required />
        <button class="submit" type="submit">Save password</button>
        <p class="form-message" id="update-message" role="status"></p>
      </form>
      <a href="forgot-password.html">Request another reset link</a>
    </main>
    <script src="../supabase-config.js"></script>
    <script src="../backend.js"></script>
    <script src="../update-password.js"></script>
  </body>
</html>
