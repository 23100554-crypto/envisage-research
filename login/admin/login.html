<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Restricted Envisage administrator sign in." />
    <title>Administrator sign in | Envisage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="simple-page admin-signin-page">
    <main class="account-card admin-signin-card">
      <a class="brand account-brand" href="../landing/index.html"
        ><span class="brand-mark">E</span><span>envisage</span></a
      >
      <p class="eyebrow">RESTRICTED ACCESS</p>
      <h1 class="account-title">Administrator sign in</h1>
      <p class="account-copy">
        Use an administrator account issued by Envisage. Admin accounts cannot be created from the
        public registration page.
      </p>
      <form id="admin-login-form">
        <label for="admin-email">Work email address</label>
        <input
          id="admin-email"
          name="email"
          type="email"
          placeholder="admin@envisage.ph"
          autocomplete="username"
          required
        />
        <label for="admin-password">Password</label>
        <div class="password-wrap"><input
          id="admin-password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
        <button class="show-password" type="button" aria-controls="admin-password" aria-label="Show password">Show</button></div>
        <p class="signin-recovery"><a href="../auth/forgot-password.html">Forgot password?</a></p>
        <button class="submit" type="submit">Sign in as admin <span>→</span></button>
        <p class="form-message" id="admin-login-message" role="status"></p>
      </form>
      <p class="signup">
        Not an administrator? <a href="../auth/login.html">Return to account sign in</a>
      </p>
      <p class="signup"><a href="../landing/index.html">← Back to homepage</a></p>
    </main>
    <script src="../supabase-config.js"></script>
    <script src="../backend.js"></script>
    <script src="admin-login.js"></script>

  </body>
</html>
